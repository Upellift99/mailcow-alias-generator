version: 2

# Commit prefixes drive release-please: only `fix` and `feat` cut a release.
# Runtime dependencies ship inside the published image, so bumping one warrants
# a patch release; dev tooling and CI actions do not.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "fix"          # requirements.txt     -> patch release
      prefix-development: "chore"  # requirements-dev.txt -> no release

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "fix"          # base image ships too -> patch release

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"           # never shipped -> no release
