name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.1. Set by the Release workflow.
        required: true
        type: string
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # docker/build-push-action uploads a `.dockerbuild` build summary as a
  # workflow artifact on every run. Nobody reads them, and they count against
  # the 0.5 GB Actions storage quota: ~1000 of them had piled up across the
  # personal repos by 2026-08-24, one per build, kept for the default 90 days.
  DOCKER_BUILD_SUMMARY: false

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # A release lands on main as a squashed "chore: release X.Y.Z" commit, which
    # would trigger this workflow here *and* through the Release workflow's
    # workflow_call — the same commit built twice. Let the release path win: it
    # publishes these same tags plus the semver ones.
    #
    # `inputs.tag` is the escape hatch, and it is load-bearing: a called
    # workflow inherits the caller's event context, so on the release push the
    # other three conditions are all false here too, and without it the release
    # path skips itself and no image is published at all.
    if: >-
      inputs.tag != ''
      || github.event_name != 'push'
      || github.ref != 'refs/heads/main'
      || !startsWith(github.event.head_commit.message, 'chore: release ')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty for push/dispatch, which checks out the triggering ref.
          ref: ${{ inputs.tag }}

      # This job reaches Docker Hub twice — for the buildkit image here, and for
      # the base image during the build — and an unauthenticated pull there is
      # rate-limited and occasionally times out. That failed the v1.0.2 release
      # and needed a manual re-run, so both steps get one retry. If the retry
      # fails too the job fails as it always did.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
