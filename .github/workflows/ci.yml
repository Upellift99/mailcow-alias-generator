name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default for all jobs; this workflow only needs to read the repo.
permissions:
  contents: read

# docker/build-push-action uploads a `.dockerbuild` build summary as a
# workflow artifact on every run. Nobody reads them, and they count against
# the 0.5 GB Actions storage quota: ~1000 of them had piled up across the
# personal repos by 2026-08-24, one per build, kept for the default 90 days.
env:
  DOCKER_BUILD_SUMMARY: false

jobs:
  lint:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Byte-compile sources
        run: python -m compileall -q app.py

      - name: Lint (critical errors — must pass)
        # Stop the build only on real problems: syntax errors and undefined names.
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Lint (full report — informational)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Docker Hub exposure as the publish workflow: the buildkit image
      # here, the base image during the build. A transient timeout there is a
      # red check that looks like a real failure, so retry each once.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mailcow-alias-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mailcow-alias-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container boots & serves the UI)
        run: |
          # Provide a minimal config so the app starts without a real Mailcow instance.
          cp config.sample.json config.json
          docker run -d --name mag -p 5000:5000 \
            -v "$PWD/config.json:/app/config.json:ro" \
            mailcow-alias-generator:ci
          echo "Waiting for the container to come up..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ >/dev/null 2>&1; then
              echo "✅ UI is reachable"
              docker rm -f mag
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container did not become healthy in time"
          docker logs mag
          docker rm -f mag
          exit 1
